[project]
name = "personal-db"
version = "0.1.0"
description = "Personal MCP server: schema-driven documents, semantic recall, notifications, calendar/contacts, attachments"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.3",
    "azure-cosmos>=4.7",
    "azure-mgmt-cosmosdb>=9.7",
    "azure-storage-blob>=12.24",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "msal>=1.31",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false
